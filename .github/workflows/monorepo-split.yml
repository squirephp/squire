name: monorepo-split

on:
    push:
        tags: '*'

permissions:
    contents: read

jobs:
    provide-packages-list:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
              with:
                  persist-credentials: false
            - uses: shivammathur/setup-php@7c071dfe9dc99bdf297fa79cb49ea005b9fcadbc # 2.37.1
              with:
                  php-version: 8.0
                  coverage: none
            - name: Install dependencies
              run: composer install -n --prefer-dist
            - id: packages-list
              run: echo "matrix=$(vendor/bin/monorepo-builder packages-json)" >> "$GITHUB_OUTPUT"
        outputs:
            matrix: ${{ steps.packages-list.outputs.matrix }}

    split-monorepo:
        needs: provide-packages-list
        runs-on: ubuntu-latest
        strategy:
            fail-fast: false
            matrix:
                package: ${{ fromJson(needs.provide-packages-list.outputs.matrix) }}
        steps:
            - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
              with:
                  persist-credentials: false
            - id: previous-tag
              uses: WyriHaximus/github-action-get-previous-tag@61819f33034117e6c686e6a31dba995a85afc9de # v2.0.0
            - name: Monorepo Split of ${{ matrix.package }}
              uses: danharrin/monorepo-split-github-action@14e42e2437f674b8987c1f50ca3689116aea1893 # v2.4.5
              env:
                  GITHUB_TOKEN: ${{ secrets.ACCESS_TOKEN }}
              with:
                  package_directory: 'packages/${{ matrix.package }}'
                  repository_organization: 'squirephp'
                  repository_name: ${{ matrix.package }}
                  branch: 3.x
                  tag: ${{ steps.previous-tag.outputs.tag }}
                  user_name: 'Dan Harrin'
                  user_email: 'dan@danharrin.com'
