name: tests

on:
    push:
    pull_request:

permissions:
    contents: read

jobs:
    run-tests:
        runs-on: ubuntu-latest
        strategy:
            fail-fast: false
            matrix:
                php: [8.3, 8.2, 8.1, 8.0]
                laravel: [13.*, 12.*, 11.*, 10.*, 9.*, 8.*]
                dependency-version: [prefer-lowest, prefer-stable]
                include:
                    - laravel: 13.*
                      testbench: 11.*
                    - laravel: 12.*
                      testbench: 10.*
                    - laravel: 11.*
                      testbench: 9.*
                    - laravel: 10.*
                      testbench: 8.*
                    - laravel: 9.*
                      testbench: 7.*
                    - laravel: 8.*
                      testbench: ^6.23
                exclude:
                    - laravel: 12.*
                      php: 8.3
                    - laravel: 11.*
                      php: 8.3
                    - laravel: 10.*
                      php: 8.3
                    - laravel: 9.*
                      php: 8.3
                    - laravel: 8.*
                      php: 8.3
                    - laravel: 13.*
                      php: 8.2
                    - laravel: 13.*
                      php: 8.1
                    - laravel: 13.*
                      php: 8.0
                    - laravel: 12.*
                      php: 8.1
                    - laravel: 12.*
                      php: 8.0
                    - laravel: 11.*
                      php: 8.1
                    - laravel: 11.*
                      php: 8.0
                    - laravel: 10.*
                      php: 8.0
        name: P${{ matrix.php }} - L${{ matrix.laravel }} - ${{ matrix.dependency-version }}
        steps:
            - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
              with:
                  persist-credentials: false
            - name: Cache dependencies
              uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
              with:
                  path: ~/.composer/cache/files
                  key: dependencies-laravel-${{ matrix.laravel }}-php-${{ matrix.php }}-composer-${{ hashFiles('composer.json') }}
            - name: Setup PHP
              uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # 2.37.2
              with:
                  php-version: ${{ matrix.php }}
                  extensions: mbstring, pdo, pdo_sqlite
                  coverage: none
            - name: Install dependencies
              env:
                  LARAVEL_CONSTRAINT: ${{ matrix.laravel }}
                  TESTBENCH_CONSTRAINT: ${{ matrix.testbench }}
                  DEPENDENCY_VERSION: ${{ matrix.dependency-version }}
              run: |
                  composer require "laravel/framework:${LARAVEL_CONSTRAINT}" "orchestra/testbench:${TESTBENCH_CONSTRAINT}" --no-interaction --no-update
                  composer update --${DEPENDENCY_VERSION} --prefer-dist --no-interaction --no-suggest
            - name: Execute tests
              run: vendor/bin/phpunit
